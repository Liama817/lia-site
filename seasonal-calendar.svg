<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Seasonal Calendar — a month grid with in-season fruit</title>
  <rect width="400" height="400" fill="#F1E7D3"/>
  <!-- calendar page -->
  <rect x="60" y="78" width="280" height="262" rx="14" fill="#FBF7EF" stroke="#6E4B33" stroke-width="3"/>
  <rect x="60" y="78" width="280" height="54" rx="14" fill="#6E4B33"/>
  <rect x="60" y="112" width="280" height="20" fill="#6E4B33"/>
  <!-- binder rings -->
  <rect x="122" y="60" width="12" height="36" rx="6" fill="#33241A"/>
  <rect x="266" y="60" width="12" height="36" rx="6" fill="#33241A"/>
  <text x="200" y="114" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#FBF7EF">In season</text>
  <!-- day grid: 5 columns x 4 rows -->
  <g fill="none" stroke="#6E4B33" stroke-opacity="0.35" stroke-width="2">
    <rect x="84" y="152" width="40" height="40" rx="6"/><rect x="132" y="152" width="40" height="40" rx="6"/>
    <rect x="180" y="152" width="40" height="40" rx="6"/><rect x="228" y="152" width="40" height="40" rx="6"/>
    <rect x="276" y="152" width="40" height="40" rx="6"/>
    <rect x="84" y="200" width="40" height="40" rx="6"/><rect x="132" y="200" width="40" height="40" rx="6"/>
    <rect x="180" y="200" width="40" height="40" rx="6"/><rect x="228" y="200" width="40" height="40" rx="6"/>
    <rect x="276" y="200" width="40" height="40" rx="6"/>
    <rect x="84" y="248" width="40" height="40" rx="6"/><rect x="132" y="248" width="40" height="40" rx="6"/>
    <rect x="180" y="248" width="40" height="40" rx="6"/><rect x="228" y="248" width="40" height="40" rx="6"/>
    <rect x="276" y="248" width="40" height="40" rx="6"/>
  </g>
  <!-- fruit: strawberry, orange, cherries, pear -->
  <g transform="translate(152 172)">
    <path d="M0 14 C-13 4 -12 -9 0 -8 C12 -9 13 4 0 14 Z" fill="#C8473C"/>
    <path d="M-7 -8 L0 -13 L7 -8 L0 -6 Z" fill="#5E7D3A"/>
  </g>
  <g transform="translate(248 220)">
    <circle r="13" fill="#E39A3B"/>
    <path d="M0 -13 q5 -6 10 -4" stroke="#5E7D3A" stroke-width="3" fill="none"/>
  </g>
  <g transform="translate(104 268)">
    <path d="M-6 2 Q0 -16 4 -16 Q6 -10 7 2" stroke="#5E7D3A" stroke-width="2.5" fill="none"/>
    <circle cx="-6" cy="6" r="7" fill="#9C2F35"/><circle cx="7" cy="6" r="7" fill="#9C2F35"/>
  </g>
  <g transform="translate(296 268)">
    <path d="M0 -14 C-6 -14 -5 -4 -9 2 C-13 10 -7 16 0 16 C7 16 13 10 9 2 C5 -4 6 -14 0 -14 Z" fill="#B5B45A"/>
    <path d="M0 -14 l2 -6" stroke="#6E4B33" stroke-width="2.5"/>
  </g>
</svg>
